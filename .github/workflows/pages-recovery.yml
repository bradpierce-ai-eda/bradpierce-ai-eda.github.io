name: Publish homepage recovery
on:
  push:
    branches: [main]
    paths: [.github/workflows/pages-recovery.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-recovery
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out published source
        uses: actions/checkout@v6
      - name: Verify requested contact email
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class Contacts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "a" and attrs.get("href", "").startswith("mailto:"):
                      self.links.append(attrs["href"])

          source = Path("index.html").read_text()
          contacts = Contacts()
          contacts.feed(source)
          assert contacts.links == ["mailto:brad@bradpierce.ai"]
          assert ">brad@bradpierce.ai</a>" in source
          assert "eda@bradpierce.ai" not in source
          assert Path("CNAME").read_text().strip() == "bradpierce.ai"
          print("Homepage contact and domain verified")
          PY
      - name: Package unchanged static site
        run: tar --exclude=.git --exclude=.github -cf "${RUNNER_TEMP}/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy to existing GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4

